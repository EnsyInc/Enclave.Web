<a class="skip-link" href="#main-content">Skip to main content</a>

<mat-sidenav-container>
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [class.collapsed]="sidenavCollapsed()"
    [class.content-hidden]="sidenavContentHidden()"
    (transitionstart)="onSidenavTransitionStart($event)"
    (transitionend)="onSidenavTransitionEnd($event)"
  >
    <div class="brand">
      <div class="logo-slot">
        <ensy-labs-icon name="logo" class="logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">Enclave</span>
        <span class="brand-subtitle">License Control</span>
      </div>
    </div>

    <mat-divider />

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [ariaCurrentWhenActive]="'page'"
        aria-label="Dashboard"
      >
        <ensy-labs-icon name="dashboard" matListItemIcon />
        <span matListItemTitle>Dashboard</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/products"
        routerLinkActive="active"
        [ariaCurrentWhenActive]="'page'"
        aria-label="Products"
      >
        <ensy-labs-icon name="products" matListItemIcon />
        <span matListItemTitle>Products</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/organizations"
        routerLinkActive="active"
        [ariaCurrentWhenActive]="'page'"
        aria-label="Organizations"
      >
        <ensy-labs-icon name="organizations" matListItemIcon />
        <span matListItemTitle>Organizations</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/licenses"
        routerLinkActive="active"
        [ariaCurrentWhenActive]="'page'"
        aria-label="Licenses"
      >
        <ensy-labs-icon name="licenses" matListItemIcon />
        <span matListItemTitle>Licenses</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/license-requests"
        routerLinkActive="active"
        [ariaCurrentWhenActive]="'page'"
        [attr.aria-label]="
          licenseRequestsCount() > 0
            ? 'License Requests, ' + licenseRequestsCount() + ' pending'
            : 'License Requests'
        "
      >
        <ensy-labs-icon
          [matBadge]="licenseRequestsCount()"
          [matBadgeDescription]="licenseRequestsCount() + ' pending license requests'"
          matBadgeSize="small"
          [matBadgeHidden]="!licenseRequestsCount() || !sidenavCollapsed()"
          name="license-requests"
          matListItemIcon
        />
        <span matListItemTitle>License Requests</span>
        @if (licenseRequestsCount() > 0 && !sidenavCollapsed()) {
          <span matListItemMeta class="license-requests-span">{{ licenseRequestsCount() }}</span>
        }
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <enclave-header (toggleSidenav)="onToggleSidenav()" />
    <main id="main-content" class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

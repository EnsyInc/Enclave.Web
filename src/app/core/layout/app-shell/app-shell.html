<mat-sidenav-container>
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [class.collapsed]="sidenavCollapsed()"
    [class.content-hidden]="sidenavContentHidden()"
    (transitionstart)="onSidenavTransitionStart($event)"
    (transitionend)="onSidenavTransitionEnd($event)"
  >
    <div class="brand">
      <div class="logo-slot">
        <ensy-labs-icon name="logo" color="var(--color-primary)" class="logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">Enclave</span>
        <span class="brand-subtitle">License Control</span>
      </div>
    </div>

    <mat-divider />

    <mat-nav-list>
      <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active">
        <ensy-labs-icon name="dashboard" matListItemIcon />
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/admin/products" routerLinkActive="active">
        <ensy-labs-icon name="products" matListItemIcon />
        <span matListItemTitle>Products</span>
      </a>
      <a mat-list-item routerLink="/admin/organizations" routerLinkActive="active">
        <ensy-labs-icon name="organizations" matListItemIcon />
        <span matListItemTitle>Organizations</span>
      </a>
      <a mat-list-item routerLink="/admin/licenses" routerLinkActive="active">
        <ensy-labs-icon name="licenses" matListItemIcon />
        <span matListItemTitle>Licenses</span>
      </a>
      <a mat-list-item routerLink="/admin/license-requests" routerLinkActive="active">
        <ensy-labs-icon name="license-requests" matListItemIcon />
        <span matListItemTitle>License Requests</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <enclave-header (toggleSidenav)="onToggleSidenav()" />
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

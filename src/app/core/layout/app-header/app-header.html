<div class="app-header">
  <div class="app-header-left">
    <button matIconButton (click)="toggleSidenav.emit()">
      <ensy-labs-icon name="sidenav" color="var(--color-text-muted)" />
    </button>

    <div class="breadcrumb">
      <span>Enclave</span>
      @if (section()) {
        <span>/</span>
        <span>{{ section() }}</span>
      }
      @if (breadcrumb()) {
        <span>/</span>
      }
      <span class="active-breadcrumb-item">{{ breadcrumb() }}</span>
    </div>
  </div>

  <div class="app-header-right">
    <button matIconButton (click)="themeService.toggle()">
      <ensy-labs-icon name="moon" color="var(--color-text-muted)" />
    </button>

    <mat-divider vertical></mat-divider>
    <div class="user-info">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-details">
        <div class="user-name">{{ userName }}</div>
        <div class="user-role">{{ userRole }}</div>
      </div>
      <button matIconButton>
        <ensy-labs-icon name="chevrons-up-down" color="var(--color-text-muted)" />
      </button>
    </div>
  </div>
</div>

<mat-divider />

<div class="details-header-container">
  @if (showTitleAvatar()) {
    <enclave-avatar [name]="title()" />
  }

  <div class="header-info">
    <span class="title">{{ title() }}</span>
    <div class="subtitle">
      @if (status()) {
        <enclave-status>{{ status() }}</enclave-status>
      }
      @if (subTitle()) {
        <span>{{ subTitle() }}</span>
      }
    </div>
  </div>
</div>

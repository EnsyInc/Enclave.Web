<div class="more-actions-button">
  <button
    matIconButton
    [matMenuTriggerFor]="moreActionsMenu"
    [attr.aria-label]="elementName() + ' actions'"
  >
    <ensy-labs-icon name="more-horizontal" />
  </button>

  <mat-menu #moreActionsMenu class="more-actions-menu">
    <ng-content />
  </mat-menu>
</div>

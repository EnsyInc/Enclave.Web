<main class="palette-demo">
  <header class="palette-demo__header">
    <h1>Enclave</h1>
    <button type="button" class="btn btn--secondary" (click)="themeService.toggle()">
      Switch to {{ themeService.theme() === 'dark' ? 'light' : 'dark' }} mode
    </button>
  </header>

  <section class="palette-demo__surface">
    <p>
      This card sits on the <code>--color-card</code> token, one step off the page
      background so content areas read as distinct from the base.
    </p>
    <p class="muted">Muted text uses <code>--color-text-muted</code> for secondary copy.</p>
  </section>

  <section class="palette-demo__buttons">
    <button type="button" class="btn btn--primary">Primary action</button>
    <button type="button" class="btn btn--secondary">Secondary action</button>
    <button type="button" class="btn btn--danger">Revoke license</button>
  </section>
</main>

<router-outlet />

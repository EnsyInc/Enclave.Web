<enclave-page-header
  title="Organizations"
  [subTitle]="`${orgCount()} total`"
  actionText="Create Organization"
  actionIcon="add"
/>

<enclave-search-bar-filter searchPlaceholder="Search Organizations" />

<div class="orgs-table-container">
  <table
    mat-table
    [dataSource]="orgDataSource()"
    class="orgs-table"
    matSort
    enclavePersistentSort
    [sortableColumns]="['name', 'status', 'primaryContactEmail']"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let element">
        <div class="org-name">
          <enclave-avatar [name]="element.name" />
          <a>
            <span>{{ element.name }}</span>
          </a>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let element">
        <div class="org-status">
          <enclave-status>{{ element.status }}</enclave-status>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="primaryContactEmail">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Primary Contact Email</th>
      <td mat-cell *matCellDef="let element">
        <div class="org-primaryContact">
          <span>
            {{ element.primaryContactEmail }}
          </span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button class="org-actions">
          <ensy-labs-icon name="chevron-right" />
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr
      mat-row
      *matRowDef="let element; columns: displayedColumns"
      [class.deactivated]="element.status === 'Deactivated'"
    ></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [colSpan]="displayedColumns.length">
        @if (orgSearch().searchText()) {
          No data matching the search term "{{ orgSearch().searchText() }}".
        } @else {
          No organizations yet. Press the "Create Organization" button above to add one.
        }
      </td>
    </tr>
  </table>
</div>

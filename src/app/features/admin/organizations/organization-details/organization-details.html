<div class="org-details-container">
  <div class="org-header">
    <enclave-avatar [name]="org().name" />

    <div class="org-header-info">
      <span class="org-name">{{ org().name }}</span>
      <div class="org-info">
        <enclave-status>{{ org().status }}</enclave-status>
        <span>{{ primaryContact()?.email }}</span>
      </div>
    </div>
  </div>
</div>

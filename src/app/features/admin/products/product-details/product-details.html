<div class="product-details-container">
  <div class="product-header">
    <enclave-avatar [name]="product().name"></enclave-avatar>

    <div class="product-header-info">
      <span class="product-name">{{ product().name }}</span>
      <enclave-status>{{ product().status }}</enclave-status>
    </div>
  </div>

  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
    <mat-tab label="Info">
      <div class="tab-content">
        <enclave-detail-card
          actionButtonIcon="edit"
          actionButtonText="Edit"
          (actionButtonClicked)="openProductFormDialog()"
        >
          <div class="product-info">
            <mat-divider />
            <enclave-detail-row label="Name">
              {{ product().name }}
            </enclave-detail-row>
            <mat-divider />
            <enclave-detail-row label="Description" [valueTooltip]="product().description">
              @if (product().description) {
                {{ product().description }}
              } @else {
                <i>No description</i>
              }
            </enclave-detail-row>
            <mat-divider />
            <enclave-detail-row label="Status">
              <enclave-status>{{ product().status }}</enclave-status>
            </enclave-detail-row>
            <mat-divider />
            <enclave-detail-row label="Id">
              {{ product().id }}
            </enclave-detail-row>
            <mat-divider />
          </div>
        </enclave-detail-card>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>

<div class="products-header">
  <div class="header-left">
    <span class="page-name">Products</span>
    <span class="page-overview"
      >{{ productsCount() }} in the catalogue - {{ activeProductsCount() }} active</span
    >
  </div>
  <div class="header-right">
    <button matButton>
      <div class="add-product">
        <ensy-labs-icon matPrefix name="add" />
        <span>Create Product</span>
      </div>
    </button>
  </div>
</div>

<div class="products-search">
  <form>
    <mat-form-field>
      <ensy-labs-icon matPrefix name="search" />
      <input placeholder="Search Products" type="text" matInput />
    </mat-form-field>
  </form>
</div>

<table mat-table [dataSource]="productsList()" class="products-table">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element" [class.retired]="element.status === 'Retired'" [class.upcoming]="element.status == 'Upcoming'">
      <div class="product-name">
        <span class="product-name-icon">{{ element.name[0] }}</span>
        <span>{{ element.name }}</span>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let element" [class.retired]="element.status === 'Retired'" [class.upcoming]="element.status == 'Upcoming'">
      <div class="product-description">
        <span>
          @if (element.description) {
            {{ element.description }}
          } @else {
            <i>No description</i>
          }
        </span>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let element" [class.retired]="element.status === 'Retired'" [class.upcoming]="element.status == 'Upcoming'">
      <div class="product-status">
        <enclave-status>{{ element.status }}</enclave-status>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element" [class.retired]="element.status === 'Retired'" [class.upcoming]="element.status == 'Upcoming'">
      <div class="product-actions">
        <button matIconButton>
          <ensy-labs-icon name="more-horizontal" color="var(--color-text)" />
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
